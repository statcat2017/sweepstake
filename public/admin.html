<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sweepstake Admin</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="top-nav">
    <span class="brand">🏆 Sweepstake 2026</span>
    <a href="/">Standings</a>
    <a href="/admin.html" class="active">Admin</a>
  </nav>

  <div class="container">
    <div id="alert-area"></div>

    <div class="card">
      <h2>Participants</h2>
      <p>Add people to the sweepstake.</p>
      <div class="form-row">
        <input type="text" id="participant-name" placeholder="Enter name" onkeydown="if(event.key==='Enter') addParticipant()">
        <button class="btn primary" onclick="addParticipant()">Add</button>
      </div>
      <div id="participant-list"></div>
    </div>

    <div class="card">
      <h2>Draw</h2>
      <p>Randomly assign teams to participants. This locks the draw.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn primary" id="draw-btn" onclick="runDraw()">Run Draw</button>
        <button class="btn danger" id="reset-btn" onclick="resetDraw()">Reset Draw</button>
        <button class="btn outline" id="seed-btn" onclick="seedMatches()">Seed Group Matches</button>
      </div>
      <div id="draw-result" style="margin-top:12px"></div>
    </div>

    <div class="card">
      <h2>Match Results</h2>
      <p>Enter scores for played matches.</p>
      <div id="match-list"></div>
    </div>
  </div>

  <script>
  let drawLocked = false;

  function alert(msg, type) {
    document.getElementById('alert-area').innerHTML = `<div class="alert ${type}">${msg}</div>`;
    setTimeout(() => document.getElementById('alert-area').innerHTML = '', 4000);
  }

  async function load() {
    const [partRes, matchRes, stateRes] = await Promise.all([
      fetch('/api/participants'),
      fetch('/api/matches'),
      fetch('/api/standings')
    ]);
    const participants = await partRes.json();
    const matches = await matchRes.json();
    const standings = await stateRes.json();

    drawLocked = participants.drawn;
    document.getElementById('draw-btn').disabled = drawLocked || participants.participants.length < 2;
    document.getElementById('reset-btn').style.display = drawLocked ? '' : 'none';

    const list = document.getElementById('participant-list');
    if (participants.participants.length === 0) {
      list.innerHTML = '<p style="color:var(--gray-400)">No participants yet.</p>';
    } else {
      list.innerHTML = `<table><thead><tr><th>Name</th><th></th></tr></thead><tbody>
        ${participants.participants.map(p => `
          <tr>
            <td>${p.name}</td>
            <td>
              ${drawLocked ? '' : `<button class="btn outline" onclick="removeParticipant(${p.id})" style="padding:4px 8px;font-size:12px">Remove</button>`}
            </td>
          </tr>
        `).join('')}
      </tbody></table>`;
    }

    if (standings.drawn && standings.participants) {
      const el = document.getElementById('draw-result');
      el.innerHTML = '<h4 style="margin-bottom:8px">Current Draw</h4><div class="grid">';
      for (const p of standings.participants) {
        const playerTeams = standings.teams.filter(t => t.participant_ids?.split(',').includes(String(p.id)));
        el.innerHTML += `<div class="participant-card">
          <h3>${p.name}</h3>
          <div>${playerTeams.map(t => `
            <span class="team-chip ${t.eliminated ? 'eliminated' : ''}">
              ${t.flag_emoji} ${t.name} (${t.group_letter})
            </span>
          `).join('')}</div>
        </div>`;
      }
      el.innerHTML += '</div>';
    }

    const matchList = document.getElementById('match-list');
    if (matches.matches?.length) {
      const byStage = {};
      for (const m of matches.matches) {
        const stage = m.stage === 'group' ? `Group ${m.group_letter}` : m.stage.replace(/_/g, ' ');
        if (!byStage[stage]) byStage[stage] = [];
        byStage[stage].push(m);
      }

      matchList.innerHTML = '';
      for (const [stage, stageMatches] of Object.entries(byStage)) {
        let html = `<h3 style="margin:12px 0 8px;font-size:15px">${stage}</h3>`;
        for (const m of stageMatches) {
          html += `
            <div class="match-card">
              <div class="teams">
                <span>${m.home_flag || ''} ${m.home_team}</span>
                <span class="vs">vs</span>
                <span>${m.away_flag || ''} ${m.away_team}</span>
              </div>
              <div class="score">
                <input type="number" min="0" id="hs-${m.id}" value="${m.home_score ?? ''}" placeholder="-" style="width:40px">
                <span>-</span>
                <input type="number" min="0" id="as-${m.id}" value="${m.away_score ?? ''}" placeholder="-" style="width:40px">
                <button class="btn primary" onclick="saveScore(${m.id})" style="padding:4px 10px;font-size:12px">Save</button>
              </div>
            </div>
          `;
        }
        matchList.innerHTML += html;
      }
    } else {
      matchList.innerHTML = '<p style="color:var(--gray-400)">No matches yet. Click "Seed Group Matches" to generate them.</p>';
    }
  }

  async function addParticipant() {
    const input = document.getElementById('participant-name');
    const name = input.value.trim();
    if (!name) return;

    const res = await fetch('/api/participants', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });

    if (res.ok) {
      input.value = '';
      alert('Participant added!', 'success');
      load();
    } else {
      const err = await res.json();
      alert(err.error, 'error');
    }
  }

  async function removeParticipant(id) {
    await fetch('/api/participants', {
      method: 'DELETE',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    });
    load();
  }

  async function runDraw() {
    document.getElementById('draw-btn').disabled = true;
    document.getElementById('draw-btn').textContent = 'Drawing...';

    const res = await fetch('/api/draw', { method: 'POST' });

    if (res.ok) {
      alert('Draw complete! Teams assigned.', 'success');
      load();
    } else {
      const err = await res.json();
      alert(err.error, 'error');
      document.getElementById('draw-btn').disabled = false;
      document.getElementById('draw-btn').textContent = 'Run Draw';
    }
  }

  async function resetDraw() {
    if (!confirm('Reset the draw? This will remove all team assignments.')) return;

    await fetch('/api/draw', { method: 'DELETE' });
    alert('Draw reset.', 'info');
    load();
  }

  async function seedMatches() {
    const res = await fetch('/api/matches/seed', { method: 'POST' });
    if (res.ok) {
      alert('Group matches seeded!', 'success');
      load();
    } else {
      alert('Failed to seed matches.', 'error');
    }
  }

  async function saveScore(matchId) {
    const homeScore = document.getElementById(`hs-${matchId}`).value;
    const awayScore = document.getElementById(`as-${matchId}`).value;

    if (homeScore === '' && awayScore === '') return;

    const res = await fetch('/api/matches', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        id: matchId,
        home_score: homeScore !== '' ? parseInt(homeScore) : null,
        away_score: awayScore !== '' ? parseInt(awayScore) : null
      })
    });

    if (res.ok) {
      alert('Score saved!', 'success');
      load();
    }
  }

  load();
  </script>
</body>
</html>
