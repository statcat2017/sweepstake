<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup 2026 Sweepstake</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="top-nav">
    <span class="brand"><svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg> Sweepstake 2026</span>
    <a href="/" class="active">Standings</a>
  </nav>

  <div class="container">
    <div id="app">
      <div class="empty-state">
        <h2>Loading...</h2>
      </div>
    </div>
  </div>

  <script>
  const ICONS = {
    trophy: '<svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',
    dice: '<svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="8.5" r="1.5"/><circle cx="15.5" cy="15.5" r="1.5"/><circle cx="8.5" cy="15.5" r="1.5"/></svg>',
    battery: '<svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="16" height="10" rx="2" ry="2"/><line x1="22" x2="22" y1="11" y2="13"/><line x1="6" x2="10" y1="11" y2="11"/></svg>',
    gift: '<svg class="icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>',
    checkCircle: '<svg class="icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>',
  };
  let allTeams = [];

  async function load() {
    const [partRes, teamsRes] = await Promise.all([
      fetch('/api/participants'),
      fetch('/api/teams')
    ]);
    const participants = await partRes.json();
    const teamsData = await teamsRes.json();
    allTeams = teamsData.teams || [];

    if (!participants.drawn) {
      showPreDraw(participants.participants);
    } else {
      const standingsRes = await fetch('/api/standings');
      const standings = await standingsRes.json();
      renderStandings(standings, participants);
    }
  }

  function showPreDraw(participantList) {
    const app = document.getElementById('app');

    if (!participantList || participantList.length === 0) {
      app.innerHTML = `<div class="card empty-state"><h2>No participants yet</h2><p>Add participants before running the draw.</p></div>`;
      return;
    }

    const playerCount = participantList.length;
    const teamCount = allTeams.length;
    const potCount = Math.floor(teamCount / playerCount);
    const mainPoolCount = potCount * playerCount;
    const bonusCount = teamCount % playerCount;

    const rankedTeams = [...allTeams].sort((a, b) => (a.fifa_rank ?? 999) - (b.fifa_rank ?? 999));
    const mainTeams = rankedTeams.slice(0, mainPoolCount);
    const bonusTeams = rankedTeams.slice(mainPoolCount);

    const pots = [];
    for (let i = 0; i < potCount; i++) {
      pots.push(mainTeams.slice(i * playerCount, (i + 1) * playerCount));
    }

    let potsHtml = '';
    for (let i = 0; i < pots.length; i++) {
      potsHtml += `<div class="pot-section">
        <div class="pot-header">Pot ${i + 1}</div>
        <div class="team-pool">
          ${pots[i].map(t => `
            <span class="team-chip" data-team="${t.name.replace(/"/g, '&quot;')}">${t.flag_emoji} ${t.name} (${t.group_letter})</span>
          `).join('')}
        </div>
      </div>`;
    }

    if (bonusCount > 0) {
      potsHtml += `<div class="pot-section">
        <div class="pot-header">Bonus</div>
        <div class="team-pool">
          ${bonusTeams.map(t => `
            <span class="team-chip" data-team="${t.name.replace(/"/g, '&quot;')}">${t.flag_emoji} ${t.name} (${t.group_letter})</span>
          `).join('')}
        </div>
      </div>`;
    }

    let html = `<h1>World Cup 2026 Sweepstake Draw</h1>
      <div class="draw-layout">
        <div class="draw-participants">
          <h2>Participants (${playerCount})</h2>
          ${participantList.map(p => `
            <div class="participant-card" data-participant="${p.name.replace(/"/g, '&quot;')}">
              <h3>${p.name}</h3>
              <div class="assigned-teams"></div>
            </div>
          `).join('')}
        </div>
        <div class="draw-pool">
          <h2>Teams (${teamCount}) — ${potCount} pots × ${playerCount}, +${bonusCount} bonus</h2>
          ${potsHtml}
        </div>
      </div>
      <div style="text-align:center;margin-top:24px">
        <button class="btn primary" id="start-draw-btn">${ICONS.dice} Start Draw</button>
      </div>`;

    app.innerHTML = html;
    document.getElementById('start-draw-btn').addEventListener('click', startDraw);
  }

  async function startDraw() {
    const btn = document.getElementById('start-draw-btn');
    btn.disabled = true;
    btn.textContent = 'Drawing...';

    const res = await fetch('/api/draw', { method: 'POST' });
    if (!res.ok) {
      const err = await res.json();
      alert('Draw failed: ' + (err.error || 'unknown error'));
      btn.disabled = false;
      btn.innerHTML = ICONS.dice + ' Start Draw';
      return;
    }

    const data = await res.json();
    animateDraw(data.participants, data.potCount, data.bonusCount);
  }

  function animateDraw(assignments, potCount, bonusCount) {
    if (!assignments || assignments.length === 0) return;

    const btnArea = document.querySelector('#app > div[style*="text-align:center"]');
    if (btnArea) btnArea.remove();

    const status = document.createElement('div');
    status.id = 'draw-status';
    status.className = 'draw-status';
    document.querySelector('.draw-layout').after(status);

    const skipBtn = document.createElement('button');
    skipBtn.id = 'skip-draw-btn';
    skipBtn.className = 'btn outline';
    skipBtn.textContent = 'Skip';
    skipBtn.style.cssText = 'display:block;margin:12px auto 0';
    status.after(skipBtn);

    let index = 0;
    let cancelled = false;
    let lastPot = null;

    function finishAll() {
      cancelled = true;
      const btn = document.getElementById('skip-draw-btn');
      if (btn) btn.remove();
      while (index < assignments.length) {
        const a = assignments[index];
        const chips = Array.from(document.querySelectorAll('.team-pool .team-chip')).filter(
          c => c.dataset.team === a.team
        );
        chips.forEach(c => {
          c.classList.remove('selected');
          c.classList.add('assigned');
        });
        const card = document.querySelector(`.participant-card[data-participant="${CSS.escape(a.participant)}"]`);
        if (card) {
          const potTag = a.pot ? ` <span class="badge pot">P${a.pot}</span>` : '';
          const bonusTag = a.bonus ? ' <span class="badge bonus">BONUS</span>' : '';
          card.querySelector('.assigned-teams').innerHTML += `<span class="team-chip">${a.flag_emoji} ${a.team}${potTag}${bonusTag}</span>`;
          card.classList.add('revealed');
        }
        index++;
      }
      status.innerHTML = ICONS.checkCircle + ' All teams assigned! Loading standings...';
      setTimeout(async () => {
        const [standingsRes, participantsRes] = await Promise.all([
          fetch('/api/standings'),
          fetch('/api/participants')
        ]);
        renderStandings(await standingsRes.json(), await participantsRes.json());
      }, 500);
    }

    skipBtn.onclick = finishAll;

    function next() {
      if (cancelled) return;
      if (index >= assignments.length) { finishAll(); return; }

      const a = assignments[index];

      if (a.pot !== lastPot) {
        lastPot = a.pot;
        if (a.bonus) {
          status.innerHTML = `${ICONS.gift} Bonus round!`;
        } else {
          status.innerHTML = `${ICONS.dice} Drawing Pot ${a.pot}`;
        }
        setTimeout(() => { if (!cancelled) showTeam(); }, 1200);
        return;
      }

      showTeam();

      function showTeam() {
        const teamChips = Array.from(document.querySelectorAll('.team-pool .team-chip')).filter(
          chip => chip.dataset.team === a.team
        );
        teamChips.forEach(chip => chip.classList.add('selected'));

        status.innerHTML = `${ICONS.dice} Drawing... <strong>${a.flag_emoji} ${a.team}</strong>`;

        setTimeout(() => {
          if (cancelled) return;
          const card = document.querySelector(`.participant-card[data-participant="${CSS.escape(a.participant)}"]`);
          if (card) {
            const potTag = a.pot ? ` <span class="badge pot">P${a.pot}</span>` : '';
            const bonusTag = a.bonus ? ' <span class="badge bonus">BONUS</span>' : '';
            card.querySelector('.assigned-teams').innerHTML += `<span class="team-chip">${a.flag_emoji} ${a.team}${potTag}${bonusTag}</span>`;
            card.classList.add('revealed');
          }

          teamChips.forEach(chip => {
            chip.classList.remove('selected');
            chip.classList.add('assigned');
          });

          const bonusLabel = a.bonus ? ` ${ICONS.gift} BONUS!` : '';
          status.innerHTML = `${a.flag_emoji} ${a.team} → <strong>${a.participant}</strong>${bonusLabel}`;
          index++;
          setTimeout(next, 3000);
        }, 2000);
      }
    }

    setTimeout(next, 1000);
  }

  function renderStandings(standings, participants) {
    const app = document.getElementById('app');

    if (!standings.drawn) {
      app.innerHTML = `<div class="card empty-state"><h2>Draw hasn't run yet</h2></div>`;
      return;
    }

    const totalAlive = standings.participants.reduce((sum, p) => sum + p.alive_count, 0);
    const totalTeams = standings.participants.reduce((sum, p) => sum + p.team_count, 0);
    const fullyAlive = standings.participants.filter(p => p.alive_count === p.team_count).length;
    const allOut = standings.participants.filter(p => p.alive_count === 0).length;
    const zeroHeroes = (standings.groupStandings || []).filter(r => (r.points ?? 0) == 0 && (r.goals_for ?? 0) == 0 && (r.played ?? 0) > 0).length;

    const grouped = {};
    for (const row of standings.groupStandings) {
      if (!grouped[row.group_letter]) grouped[row.group_letter] = [];
      grouped[row.group_letter].push(row);
    }

    const fixturesByGroup = {};
    for (const f of (standings.groupFixtures || [])) {
      if (!fixturesByGroup[f.group_letter]) fixturesByGroup[f.group_letter] = [];
      fixturesByGroup[f.group_letter].push(f);
    }

    function formatUTC(iso) {
      if (!iso) return 'TBD';
      const d = new Date(iso);
      const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
      const h = String(d.getUTCHours()).padStart(2, '0');
      const m = String(d.getUTCMinutes()).padStart(2, '0');
      return `${months[d.getUTCMonth()]} ${d.getUTCDate()}, ${h}:${m} UTC`;
    }

    let html = `
      <div class="card">
        <h1>World Cup 2026 Sweepstake</h1>
        <div class="summary-strip">
          <div class="summary-stat">
            <div class="value">${standings.participants.length}</div>
            <div class="label">Players</div>
          </div>
          <div class="summary-stat">
            <div class="value">${totalAlive}/${totalTeams}</div>
            <div class="label">Teams Alive</div>
          </div>
          <div class="summary-stat">
            <div class="value">${fullyAlive}</div>
            <div class="label">All Alive</div>
          </div>
          <div class="summary-stat">
            <div class="value">${allOut}</div>
            <div class="label">Eliminated</div>
          </div>
          <div class="summary-stat zero-hero-stat">
            <div class="value">${zeroHeroes}</div>
            <div class="label">${ICONS.battery} Money Back</div>
          </div>
          ${standings.mostConceded && standings.mostConceded.goals_against > 0 ? `
          <div class="summary-stat" style="text-align:center">
            <div class="value">${standings.mostConceded.flag_emoji} ${standings.mostConceded.goals_against}</div>
            <div class="label">Most Conceded (${standings.mostConceded.name})</div>
          </div>` : ''}
        </div>
      </div>

      <h2>Participants</h2>
      <div class="grid">
    `;

    for (const p of standings.participants) {
      const playerTeams = standings.teams.filter(t => t.participant_id == p.id);
      html += `
        <div class="participant-card">
          <h3>${p.name}</h3>
          <div style="margin-bottom:6px">
            <span class="badge ${p.alive_count > 0 ? 'alive' : 'eliminated'}">
              ${p.alive_count}/${p.team_count} alive
            </span>
          </div>
          <div>${playerTeams.sort((a, b) => (a.pot ?? 99) - (b.pot ?? 99)).map(t => `
            <span class="team-chip ${t.status === 'eliminated' ? 'eliminated' : ''}">
              ${t.flag_emoji} ${t.name} (${t.group_letter})${t.pot ? ` <span class="badge pot">P${t.pot}</span>` : ''}${t.bonus ? ' <span class="badge bonus">BONUS</span>' : ''}
            </span>
          `).join('')}</div>
        </div>
      `;
    }

    html += `</div><h2 style="margin-top:24px">Group Standings</h2>`;

    for (const [group, rows] of Object.entries(grouped)) {
      html += `
        <div class="group-section">
          <h3>Group ${group}</h3>
          <div class="group-layout">
          <table class="standings-table">
            <colgroup>
              <col style="width:30px">
              <col style="width:220px">
              <col style="width:40px">
              <col style="width:40px">
              <col style="width:40px">
              <col style="width:45px">
              <col style="width:40px">
              <col style="width:55px">
            </colgroup>
            <thead><tr>
              <th class="pos col-num">#</th>
              <th>Team</th>
              <th class="col-num">Pld</th>
              <th class="col-num">GF</th>
              <th class="col-num">GA</th>
              <th class="col-num">GD</th>
              <th class="col-num col-pts">Pts</th>
              <th class="col-num"></th>
            </tr></thead>
            <tbody>
      `;

      rows.forEach((r) => {
        const gf = r.goals_for ?? 0;
        const ga = r.goals_against ?? 0;
        const pts = r.points ?? 0;
        const pld = r.played ?? 0;
        const gd = gf - ga;
        const gdStr = gd > 0 ? `+${gd}` : String(gd);
        const zeroHero = pts == 0 && gf == 0 && pld > 0;
        const statusClass = r.status === 'qualified' || r.status === 'qualifying' ? 'status-qualified' : (r.status === 'eliminated' || r.status === 'eliminating' ? 'status-eliminated' : 'status-third');
        const statusBadge = zeroHero ? '<span class="badge zero-hero-badge">' + ICONS.battery + '</span>' : (r.status === 'qualified' ? '<span class="badge alive">Q</span>' : (r.status === 'eliminated' ? '<span class="badge eliminated">OUT</span>' : (r.status === 'third' ? '<span class="badge third">TBD</span>' : '<span class="badge alive">LIVE</span>')));
        html += `<tr class="${statusClass} ${zeroHero ? 'zero-hero' : ''}">
          <td class="pos col-num">${r.position ?? '-'}</td>
          <td>${r.flag_emoji} ${r.team_name}</td>
          <td class="col-num">${pld}</td>
          <td class="col-num">${gf}</td>
          <td class="col-num">${ga}</td>
          <td class="col-num">${gdStr}</td>
          <td class="col-num col-pts">${pts}</td>
          <td class="col-num">${statusBadge}</td>
        </tr>`;
      });

      html += `</tbody></table>`;

      // Fixtures panel
      const groupFixtures = fixturesByGroup[group] || [];
      if (groupFixtures.length > 0) {
        html += `<div class="group-fixtures">`;
        for (const f of groupFixtures) {
          const score = f.played ? `${f.home_score ?? 0}–${f.away_score ?? 0}` : 'vs';
          html += `<div class="fixture-row">
            <span class="fixture-time">${formatUTC(f.kickoff_at)}</span>
            <span class="fixture-home">${f.home_flag || ''} ${f.home_team || '?'}</span>
            <span class="fixture-score">${score}</span>
            <span class="fixture-away">${f.away_flag || ''} ${f.away_team || '?'}</span>
          </div>`;
        }
        html += `</div>`;
      }

      html += `</div></div>`;
    }

    if (standings.thirdPlaceRanking && standings.thirdPlaceRanking.length > 0) {
      html += `<h2 style="margin-top:24px">Third-Placed Ranking</h2>
        <p style="margin-bottom:12px">Current 3rd-place teams — top 8 advance to Round of 32.</p>
        <table class="standings-table">
          <colgroup>
            <col style="width:30px">
            <col style="width:220px">
            <col style="width:40px">
            <col style="width:40px">
            <col style="width:40px">
            <col style="width:45px">
            <col style="width:40px">
            <col style="width:55px">
          </colgroup>
          <thead><tr>
            <th class="pos col-num">#</th>
            <th>Team</th>
            <th class="col-num">Pld</th>
            <th class="col-num">GF</th>
            <th class="col-num">GA</th>
            <th class="col-num">GD</th>
            <th class="col-num col-pts">Pts</th>
            <th class="col-num"></th>
          </tr></thead>
          <tbody>`;

      for (const r of standings.thirdPlaceRanking) {
        const gf = r.goals_for ?? 0;
        const ga = r.goals_against ?? 0;
        const pts = r.points ?? 0;
        const pld = r.played ?? 0;
        const gd = gf - ga;
        const gdStr = gd > 0 ? `+${gd}` : String(gd);
        const isDefinitive = r.status === 'qualified' || r.status === 'eliminated';
        const zeroHero = pts == 0 && gf == 0 && pld > 0;
        const rowClass = r.third_rank <= 8 ? 'status-qualified' : 'status-eliminated';
        const badge = zeroHero ? '<span class="badge zero-hero-badge">' + ICONS.battery + '</span>' : (isDefinitive ? (r.status === 'qualified' ? '<span class="badge alive">Q</span>' : '<span class="badge eliminated">OUT</span>') : '<span class="badge third">TBD</span>');
        html += `<tr class="${rowClass} ${zeroHero ? 'zero-hero' : ''}">
          <td class="pos col-num">${r.third_rank}</td>
          <td>${r.flag_emoji} ${r.team_name} (${r.group_letter})</td>
          <td class="col-num">${pld}</td>
          <td class="col-num">${gf}</td>
          <td class="col-num">${ga}</td>
          <td class="col-num">${gdStr}</td>
          <td class="col-num col-pts">${pts}</td>
          <td class="col-num">${badge}</td>
        </tr>`;
      }

      html += `</tbody></table>`;
    }

    app.innerHTML = html;

    if ((standings.knockoutMatches || []).length > 0) {
      const byStage = {};
      for (const m of standings.knockoutMatches) {
        if (!byStage[m.stage]) byStage[m.stage] = [];
        byStage[m.stage].push(m);
      }

      const colLabels = ['Round of 32', 'Round of 16', 'Quarter-Final', 'Semi-Final', 'Final', 'Semi-Final', 'Quarter-Final', 'Round of 16', 'Round of 32'];
      const positions = [];

      const r32 = byStage.round_of_32 || [];
      r32.slice(0, 8).forEach((m, i) => positions.push({ m, col: 1, row: i * 2 + 2, span: 2 }));
      r32.slice(8).forEach((m, i) => positions.push({ m, col: 9, row: i * 2 + 2, span: 2 }));

      const r16 = byStage.round_of_16 || [];
      r16.slice(0, 4).forEach((m, i) => positions.push({ m, col: 2, row: i * 4 + 2, span: 4 }));
      r16.slice(4).forEach((m, i) => positions.push({ m, col: 8, row: i * 4 + 2, span: 4 }));

      const qf = byStage.quarter_final || [];
      qf.slice(0, 2).forEach((m, i) => positions.push({ m, col: 3, row: i * 8 + 2, span: 8 }));
      qf.slice(2).forEach((m, i) => positions.push({ m, col: 7, row: i * 8 + 2, span: 8 }));

      const sf = byStage.semi_final || [];
      sf.slice(0, 1).forEach((m) => positions.push({ m, col: 4, row: 2, span: 16 }));
      sf.slice(1).forEach((m) => positions.push({ m, col: 6, row: 2, span: 16 }));

      const finals = byStage.final || [];
      finals.forEach((m) => positions.push({ m, col: 5, row: 2, span: 10 }));

      const third = byStage.third_place || [];
      third.forEach((m) => positions.push({ m, col: 5, row: 13, span: 5 }));

      let bracketHtml = `<div class="ko-bracket"><h2 style="margin-top:24px">Knockout Stage</h2><div class="ko-bracket-grid">`;

      for (let c = 0; c < 9; c++) {
        bracketHtml += `<div class="ko-round-label">${colLabels[c]}</div>`;
      }

      for (const p of positions) {
        const m = p.m;
        const homeScore = m.home_score != null ? m.home_score : '-';
        const awayScore = m.away_score != null ? m.away_score : '-';
        const homeWon = m.home_score != null && m.away_score != null && m.home_score > m.away_score;
        const awayWon = m.home_score != null && m.away_score != null && m.away_score > m.home_score;
        const homeLabel = m.home_team ? `${m.home_flag || ''} ${m.home_team}` : (m.match_label || 'TBD');
        const awayLabel = m.away_team ? `${m.away_flag || ''} ${m.away_team}` : (m.match_label || 'TBD');

        bracketHtml += `<div class="ko-match" style="grid-column:${p.col};grid-row:${p.row}/span ${p.span}">
          <span class="ko-team${homeWon ? ' winner' : ''}">${homeLabel}</span>
          <span class="ko-score">${homeScore} – ${awayScore}</span>
          <span class="ko-team${awayWon ? ' winner' : ''}">${awayLabel}</span>
        </div>`;
      }

      bracketHtml += `</div></div>`;
      app.innerHTML += bracketHtml;
    }
  }

  load();
  </script>
</body>
</html>
