<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Cup 2026 Sweepstake</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="top-nav">
    <span class="brand">🏆 Sweepstake 2026</span>
    <a href="/" class="active">Standings</a>
  </nav>

  <div class="container">
    <div id="app">
      <div class="empty-state">
        <h3>Loading...</h3>
      </div>
    </div>
  </div>

  <script>
  let allTeams = [];

  async function load() {
    const [partRes, teamsRes] = await Promise.all([
      fetch('/api/participants'),
      fetch('/api/teams')
    ]);
    const participants = await partRes.json();
    const teamsData = await teamsRes.json();
    allTeams = teamsData.teams || [];

    if (!participants.drawn) {
      showPreDraw(participants.participants);
    } else {
      const standingsRes = await fetch('/api/standings');
      const standings = await standingsRes.json();
      renderStandings(standings, participants);
    }
  }

  function showPreDraw(participantList) {
    const app = document.getElementById('app');

    if (!participantList || participantList.length === 0) {
      app.innerHTML = `<div class="card empty-state"><h3>No participants yet</h3><p>Add participants before running the draw.</p></div>`;
      return;
    }

    let html = `<h1>World Cup 2026 Sweepstake Draw</h1>
      <div class="draw-layout">
        <div class="draw-participants">
          <h2>Participants</h2>
          ${participantList.map(p => `
            <div class="participant-card" data-participant="${p.name.replace(/"/g, '&quot;')}">
              <h3>${p.name}</h3>
              <div class="assigned-teams"></div>
            </div>
          `).join('')}
        </div>
        <div class="draw-pool">
          <h2>Teams</h2>
          <div class="team-pool">
            ${allTeams.map(t => `
              <span class="team-chip" data-team="${t.name.replace(/"/g, '&quot;')}">${t.flag_emoji} ${t.name} (${t.group_letter})</span>
            `).join('')}
          </div>
        </div>
      </div>
      <div style="text-align:center;margin-top:24px">
        <button class="btn primary" id="start-draw-btn">🎲 Start Draw</button>
      </div>`;

    app.innerHTML = html;
    document.getElementById('start-draw-btn').addEventListener('click', startDraw);
  }

  async function startDraw() {
    const btn = document.getElementById('start-draw-btn');
    btn.disabled = true;
    btn.textContent = 'Drawing...';

    const res = await fetch('/api/draw', { method: 'POST' });
    if (!res.ok) {
      const err = await res.json();
      alert('Draw failed: ' + (err.error || 'unknown error'));
      btn.disabled = false;
      btn.textContent = '🎲 Start Draw';
      return;
    }

    const data = await res.json();
    animateDraw(data.participants);
  }

  function animateDraw(assignments) {
    if (!assignments || assignments.length === 0) return;

    const btnArea = document.querySelector('#app > div[style*="text-align:center"]');
    if (btnArea) btnArea.remove();

    const status = document.createElement('div');
    status.id = 'draw-status';
    status.className = 'draw-status';
    document.querySelector('.draw-layout').after(status);

    let index = 0;

    function next() {
      if (index >= assignments.length) {
        status.textContent = '🎉 All teams assigned! Loading standings...';
        setTimeout(async () => {
          const [standingsRes, participantsRes] = await Promise.all([
            fetch('/api/standings'),
            fetch('/api/participants')
          ]);
          renderStandings(await standingsRes.json(), await participantsRes.json());
        }, 2000);
        return;
      }

      const a = assignments[index];
      const teamChips = Array.from(document.querySelectorAll('.team-pool .team-chip')).filter(
        chip => chip.dataset.team === a.team
      );
      teamChips.forEach(chip => chip.classList.add('selected'));

      status.innerHTML = `🎲 Drawing... <strong>${a.flag_emoji} ${a.team}</strong>`;

      setTimeout(() => {
        const card = document.querySelector(`.participant-card[data-participant="${CSS.escape(a.participant)}"]`);
        if (card) {
          const bonusTag = a.bonus ? ' <span class="badge bonus">BONUS</span>' : '';
          card.querySelector('.assigned-teams').innerHTML += `<span class="team-chip">${a.flag_emoji} ${a.team}${bonusTag}</span>`;
          card.classList.add('revealed');
        }

        teamChips.forEach(chip => {
          chip.classList.remove('selected');
          chip.classList.add('assigned');
        });

        const bonusLabel = a.bonus ? ' 🎁 BONUS!' : '';
        status.innerHTML = `${a.flag_emoji} ${a.team} → <strong>${a.participant}</strong>${bonusLabel}`;
        index++;
        setTimeout(next, 3000);
      }, 2000);
    }

    setTimeout(next, 1000);
  }

  function renderStandings(standings, participants) {
    const app = document.getElementById('app');

    if (!standings.drawn) {
      app.innerHTML = `<div class="card empty-state"><h3>Draw hasn't run yet</h3></div>`;
      return;
    }

    const totalAlive = standings.participants.reduce((sum, p) => sum + p.alive_count, 0);
    const totalTeams = standings.participants.reduce((sum, p) => sum + p.team_count, 0);
    const fullyAlive = standings.participants.filter(p => p.alive_count === p.team_count).length;
    const allOut = standings.participants.filter(p => p.alive_count === 0).length;
    const zeroHeroes = (standings.groupStandings || []).filter(r => r.points == 0 && r.goals_for == 0 && r.played > 0).length;

    const grouped = {};
    for (const row of standings.groupStandings) {
      if (!grouped[row.group_letter]) grouped[row.group_letter] = [];
      grouped[row.group_letter].push(row);
    }

    let html = `
      <div class="card">
        <h1>World Cup 2026 Sweepstake</h1>
        <div class="summary-strip">
          <div class="summary-stat">
            <div class="value">${standings.participants.length}</div>
            <div class="label">Players</div>
          </div>
          <div class="summary-stat">
            <div class="value">${totalAlive}/${totalTeams}</div>
            <div class="label">Teams Alive</div>
          </div>
          <div class="summary-stat">
            <div class="value">${fullyAlive}</div>
            <div class="label">All Alive</div>
          </div>
          <div class="summary-stat">
            <div class="value">${allOut}</div>
            <div class="label">Eliminated</div>
          </div>
          <div class="summary-stat zero-hero-stat">
            <div class="value">${zeroHeroes}</div>
            <div class="label">🪫 Money Back</div>
          </div>
        </div>
      </div>

      <h2>Participants</h2>
      <div class="grid">
    `;

    for (const p of standings.participants) {
      const playerTeams = standings.teams.filter(t => t.participant_id == p.id);
      html += `
        <div class="participant-card">
          <h3>${p.name}</h3>
          <div style="margin-bottom:6px">
            <span class="badge ${p.alive_count > 0 ? 'alive' : 'eliminated'}">
              ${p.alive_count}/${p.team_count} alive
            </span>
          </div>
          <div>${playerTeams.map(t => `
            <span class="team-chip ${t.eliminated ? 'eliminated' : ''}">
              ${t.flag_emoji} ${t.name} (${t.group_letter})${t.bonus ? ' <span class="badge bonus">BONUS</span>' : ''}
            </span>
          `).join('')}</div>
        </div>
      `;
    }

    html += `</div><h2 style="margin-top:24px">Group Standings</h2>`;

    for (const [group, rows] of Object.entries(grouped)) {
      html += `
        <div class="group-section">
          <h3>Group ${group}</h3>
          <table class="standings-table">
            <thead><tr>
              <th class="pos">#</th>
              <th>Team</th>
              <th>Pld</th>
              <th>GF</th>
              <th>GA</th>
              <th>GD</th>
              <th class="pts">Pts</th>
              <th></th>
            </tr></thead>
            <tbody>
      `;

      rows.forEach((r, i) => {
        const gd = r.goals_for - r.goals_against;
        const gdStr = gd > 0 ? `+${gd}` : String(gd);
        const zeroHero = r.points == 0 && r.goals_for == 0 && r.played > 0;
        html += `<tr class="${zeroHero ? 'zero-hero' : ''}"${r.eliminated ? ' style="opacity:0.4;text-decoration:line-through"' : ''}>
          <td class="pos">${i + 1}</td>
          <td>${r.flag_emoji} ${r.team_name}</td>
          <td>${r.played}</td>
          <td>${r.goals_for}</td>
          <td>${r.goals_against}</td>
          <td>${gdStr}</td>
          <td class="pts">${r.points}</td>
          <td>${zeroHero ? '<span class="badge zero-hero-badge">🪫</span>' : (r.eliminated ? '<span class="badge eliminated">OUT</span>' : '<span class="badge alive">LIVE</span>')}</td>
        </tr>`;
      });

      html += `</tbody></table></div>`;
    }

    app.innerHTML = html;
  }

  load();
  </script>
</body>
</html>
